name: Deploy VitePress (User Site)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci || npm i

      - run: npx vitepress build

      - name: Check out RxJS Type Notation documentation
        uses: actions/checkout@v4
        with:
          repository: hansschenker/rxjs-type-notation
          ref: main
          path: .notation-source
          persist-credentials: false

      - name: Install notation documentation dependencies
        run: npm ci
        working-directory: .notation-source

      - name: Check and build notation documentation
        run: npm run build
        working-directory: .notation-source

      - name: Include notation documentation in the portfolio
        run: |
          mkdir -p .vitepress/dist/rxjs-type-notation
          cp -a .notation-source/docs/.vitepress/dist/. .vitepress/dist/rxjs-type-notation/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./.vitepress/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
