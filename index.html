<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hans Schenker — RxJS Projects</title>
<style>
:root{--bg:#0b0f14;--card:#121821;--muted:#94a3b8;--text:#e2e8f0;--accent:#60a5fa;--border:#1f2937}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
.wrap{max-width:1040px;margin:40px auto;padding:0 16px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:28px;margin:0}.sub{color:var(--muted);margin-top:4px}.search{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
input[type=search]{flex:1;min-width:220px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:#0f1520;color:var(--text)}
.tags{display:flex;gap:8px;flex-wrap:wrap}.tag{border:1px solid var(--border);background:#0f1520;color:var(--muted);padding:4px 8px;border-radius:9999px;font-size:12px;cursor:pointer}
.tag.active{color:#cfe7ff;border-color:#2a3a52}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:20px}
.card{border:1px solid var(--border);background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card a{color:var(--accent);text-decoration:none;font-weight:600}.muted{color:var(--muted);font-size:13px}
.pill{display:inline-block;padding:3px 8px;border:1px solid var(--border);border-radius:9999px;font-size:12px;margin-right:6px;color:#93c5fd;background:#0f1520}
footer{margin-top:32px;color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.credit{color:var(--muted)}
</style></head><body>
<div class="wrap">
<header><div><h1>RxJS Project Index</h1><div class="sub">All my RxJS mini-apps, demos, and tools in one place.</div></div></header>
<div class="search"><input id="q" type="search" placeholder="Search by name, tags, or description…"/><div class="tags" id="tags"></div></div>
<section id="list" class="grid" aria-live="polite"></section>
<footer><span class="credit">Built as a static index. Add or modify entries in <code>projects.json</code>.</span><span>•</span>
<a class="credit" href="https://github.com/hansschenker" target="_blank" rel="noreferrer">GitHub</a></footer></div>
<script>
const $q=document.getElementById('q'),$list=document.getElementById('list'),$tags=document.getElementById('tags');let projects=[],activeTag='';
fetch('projects.json').then(r=>r.json()).then(data=>{projects=data;renderTags();render();});
function renderTags(){const set=new Set();projects.forEach(p=>(p.tags||[]).forEach(t=>set.add(t)));const tags=[...set].sort();
$tags.innerHTML=tags.map(t=>`<button class="tag" data-t="${t}">${t}</button>`).join('');
$tags.addEventListener('click',e=>{const btn=e.target.closest('.tag');if(!btn)return;const t=btn.getAttribute('data-t');activeTag=(activeTag===t)?'':t;
for(const el of $tags.querySelectorAll('.tag')){el.classList.toggle('active',el.getAttribute('data-t')===activeTag)}render();});}
function matches(p,q){if(!q&&!activeTag)return true;const hay=(p.name+' '+(p.description||'')+' '+(p.tags||[]).join(' ')).toLowerCase();
const okQ=q?hay.includes(q.toLowerCase()):true;const okT=activeTag?(p.tags||[]).includes(activeTag):true;return okQ&&okT;}
function render(){const q=$q.value.trim();const filtered=projects.filter(p=>matches(p,q));
$list.innerHTML=filtered.map(p=>`
<article class="card"><div><a href="${p.url}" target="_blank" rel="noreferrer">${p.name}</a></div>
<div class="muted">${p.description||''}</div><div>${(p.tags||[]).map(t=>`<span class="pill">${t}</span>`).join('')}</div>
<div class="muted">Repo: <a href="https://github.com/${p.repo}" target="_blank" rel="noreferrer">${p.repo}</a></div></article>`).join('');}
$q.addEventListener('input',render);
</script></body></html>
